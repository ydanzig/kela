[pytest]
markers =
    positive: Positive test scenarios
    negative: Negative and validation scenarios
    state: State-based tests (e.g., delete)
    tasks: Task-related tests
    login: Login-related tests
    stress: Stress and performance tests
    edge: Edge case tests
    urgent: Urgent event tests
    sanity: Sanity tests for critical functionality
    history: Tests related to task history and audit logs